# Compila, lintea y prueba en cada push y en cada pull request.
#
# Nada de esto toca la base ni el correo, así que no necesita ningún secreto.
#
# Las versiones de Node no son iguales en los dos trabajos a propósito: el
# backend corre en Railway sobre Node 18, y probarlo en otra versión haría que
# un verde aquí no dijera nada sobre lo que corre el sitio. El frontend no puede
# usar 18 porque Vite 8 exige 20 o más, y en Railway ya se construye con una
# versión moderna.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la comprobación anterior: lo que
# importa es si el último commit está bien.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # El cliente de Prisma se genera a partir del esquema y no está en el
      # repositorio: sin esto, la comprobación de tipos no encuentra los modelos.
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
