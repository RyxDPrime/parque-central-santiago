# Compila, lintea y prueba en cada push y en cada pull request.
#
# Nada de esto toca la base ni el correo, así que no necesita ningún secreto.
#
# La versión de Node no se escribe aquí: sale del .node-version de cada mitad,
# que es el mismo archivo que lee Railway para decidir con qué versión corre. Si
# se pusiera a mano, un cambio de runtime en producción dejaría a CI probando
# sobre otra cosa, y un verde aquí no diría nada sobre lo que corre el sitio.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la comprobación anterior: lo que
# importa es si el último commit está bien.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # El cliente de Prisma se genera a partir del esquema y no está en el
      # repositorio: sin esto, la comprobación de tipos no encuentra los modelos.
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
